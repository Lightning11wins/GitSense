[workspace]
resolver = "3"
members = ["crates/protocol", "crates/helper", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
gitsense-protocol = { path = "crates/protocol" }
gitsense-client = { path = "crates/client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

# Hashing and compressing the helper is slow without optimization.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.base64]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
# Smaller test uploads; the helper is debugged through its tests and logs.
[profile.dev.package.gitsense-helper]
debug = false
strip = true
